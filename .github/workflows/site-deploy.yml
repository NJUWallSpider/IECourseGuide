name: Deploy site

# 构建 MkDocs 站点并发布到 GitHub Pages。
# 三种触发方式：
#   1. 推送到 main（人工改内容 / 合并 PR）；
#   2. Actions 手动运行（workflow_dispatch）；
#   3. 由「投稿落库」工作流在机器人提交后复用调用（workflow_call），
#      因为用 GITHUB_TOKEN 推送的提交不会自动触发 push 事件。

on:
  push:
    branches: [main]
    paths:
      - 'IE-wiki/**'
      - 'tools/gen_courses.py'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 注意：本工作流被 contribution-apply 以 workflow_call 复用调用时，
          # github.sha 仍是触发 apply 的那次事件（Issue 评论）的旧提交，
          # 若用默认检出会漏掉机器人刚推送的新内容。这里显式检出默认分支最新提交。
          ref: ${{ github.event.repository.default_branch }}
          # git-revision-date 插件需要完整历史来取「最后更新日期」
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: IE-wiki/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r IE-wiki/requirements.txt

      - name: Generate course catalog
        # 投稿页的「课程 / 页面」下拉数据；新增课程页后自动包含
        run: python tools/gen_courses.py

      - name: Build site
        run: mkdocs build -f IE-wiki/mkdocs.yml -d "$PWD/site"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
