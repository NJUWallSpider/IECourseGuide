name: Site check

# PR / 手动触发：构建站点 + 跑投稿自动化测试，防止把站点或机器人脚本改坏。
on:
  pull_request:
    paths:
      - 'IE-wiki/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Submission tools tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Run tests
        run: python -m pytest tools/tests -q

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: IE-wiki/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r IE-wiki/requirements.txt

      - name: Generate course catalog
        run: python tools/gen_courses.py

      - name: Build site
        run: mkdocs build -f IE-wiki/mkdocs.yml -d "$PWD/site"

      - name: Verify contribution entry is present
        run: |
          test -f "site/提交修改/index.html"
          grep -q 'ie-contribution-card' "site/提交修改/index.html"
          grep -q 'js/contribution-entry.js' "site/index.html"
